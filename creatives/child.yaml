# =============================================================================
# ViMax-Agnes 创意配置文件模板
# =============================================================================
#
# 这是一个完整的创意配置示例，包含所有可用字段及详细注释。
# 复制此文件并根据需要修改即可创建新的创意。
#
# 用法：
#   python main_idea2video.py creatives/example.yaml
#   python run_creative.py creatives/example.yaml
#   python run_creative.py --list    # 列出所有可用创意
#
# =============================================================================

# ── 创意名称 ─────────────────────────────────────────────────────────────────
# 必填。用于标识该创意，也会用作输出目录的命名前缀。
# 建议使用英文小写+下划线，简洁明了。
name: "child"

# ── 创意描述（idea）──────────────────────────────────────────────────────────
# 必填。用自然语言描述你想要创作的视频内容。
# 可以包含人物、场景、动作、情节走向等要素。
# 越详细越好，帮助 AI 更好地理解你的意图。
# 使用 | (literal block) 保留换行，使内容更易读。
idea: |
  小女孩小挚从出生到长到6岁左右的过程，共8个场景，每个场景8秒左右，每个场景都是女孩逐渐长大的过程，从只是一个床上的小婴儿，到逐渐会走，然后在大自然玩耍。场景1:在床上一点点长大，场景2:学会走路，场景3:两岁左右开始变得调皮，场景4:2岁到3岁，场景5:3岁到4岁，场景6:4岁到5岁，场景7:5岁到6岁，场景8:6岁多，能够在户外自由的玩耍和运动。

# ── 用户要求（user_requirement）─────────────────────────────────────────────
# 必填。明确的技术约束和创作要求。
# 包括：场景数量、每个场景的时长、画面比例、风格方向等。
user_requirement: |
  8个场景，每个场景8秒，电影质感，竖屏拍摄(768x1152)

# ── 视觉风格（style）────────────────────────────────────────────────────────
# 必填。视频的整体视觉风格描述。
# 常见风格：电影质感、动漫风格、写实风格、MV风格、Vlog风格、赛博朋克等。
# 这个值会传递给 AI 作为风格指导词。
style: "电影质感写实风格"

# ── 参考图（reference_image）────────────────────────────────────────────────
# 可选。提供一张参考图来指导角色外观和场景风格。
# - 空字符串 "": 自动从故事描述中生成角色参考图（推荐）
# - 本地文件路径: "/path/to/reference.jpg"
# - URL: "https://example.com/reference.jpg"
#
# 注意：如果提供了参考图，所有场景的视频生成都将基于此图。
reference_image: "/Users/lcy/Downloads/scene_0.jpg"

# ── 场景串联模式（chaining_mode）────────────────────────────────────────────
# 可选，默认 "none"。控制场景之间的过渡方式：
#
# - "none":      每个场景独立生成，使用同一张参考图（最快，但过渡生硬）
# - "ti2vid":    顺序生成，场景间通过 img2img 生成过渡帧（平滑过渡）
# - "keyframes": 顺序生成，使用首帧+末帧关键帧方式（最平滑，推荐）
#
# 推荐：对于需要流畅过渡的多场景视频，使用 "keyframes"。
chaining_mode: "keyframes"

# ── 视频尺寸 ────────────────────────────────────────────────────────────────
# 视频的宽度和高度（像素）。
# - 竖屏：768 x 1152（推荐用于手机短视频）
# - 横屏：1152 x 768（推荐用于常规视频）
# 注意：尺寸会影响生成的参考图比例，请保持一致。
video_width: 768
video_height: 1152

# ── 自定义尾帧（可选）─────────────────────────────────────────────────────────
# 给每个场景指定 end_frame 图片。支持本地路径或 URL。
# 本地文件会自动 resize 到视频尺寸。场景数多于图片数时，多余的自动生成。
# 留空或删除此字段 = 全部自动生成（默认行为）
end_frame_images:
  - /Users/lcy/Downloads/scene_1.jpg
  - /Users/lcy/Downloads/scene_2.jpg
  - /Users/lcy/Downloads/scene_3.jpg
  - /Users/lcy/Downloads/scene_4.jpg
  - /Users/lcy/Downloads/scene_5.jpg
  - /Users/lcy/Downloads/scene_6.jpg
  - /Users/lcy/Downloads/scene_7.jpg
  - /Users/lcy/Downloads/scene_8.jpg
